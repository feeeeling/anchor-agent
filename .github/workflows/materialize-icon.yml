name: Materialize marketplace icon
on:
  push:
    branches: [feat/p2-marketplace-polish]
    paths:
      - "media/icon.b64"
      - ".github/workflows/materialize-icon.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/p2-marketplace-polish
      - name: Decode and verify PNG
        run: |
          set -euo pipefail
          test -f media/icon.b64
          base64 -d media/icon.b64 > media/icon.png
          python3 - <<'PY'
          from pathlib import Path
          b = Path("media/icon.png").read_bytes()
          assert b[:8] == bytes.fromhex("89504e470d0a1a0a"), b[:8].hex()
          assert len(b) == 1012, len(b)
          print("ok", len(b), b[:8].hex())
          PY
          rm -f media/icon.b64
          rm -f .github/workflows/materialize-icon.yml
      - name: Commit valid icon
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A media/icon.png
          git add -u media/icon.b64 .github/workflows/materialize-icon.yml || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: write valid 128px media/icon.png"
          git push origin HEAD:feat/p2-marketplace-polish
